# =============================================================================
# Alertmanager 配置 — 告警路由与静默规则
# =============================================================================

global:
  resolve_timeout: 5m

# ── 路由树 ────────────────────────────────────────────────────
route:
  receiver: "default-receiver"
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

  # 严重告警单独路由
  routes:
    - match:
        severity: critical
      receiver: "critical-receiver"
      repeat_interval: 15m

# ── 接收器 ────────────────────────────────────────────────────
receivers:
  - name: "default-receiver"
    webhook_configs:
      - url: "http://localhost:8080/webhook"  # 预留 webhook 接口

  - name: "critical-receiver"
    webhook_configs:
      - url: "http://localhost:8080/webhook"

# ── 抑制规则：同一主机同类告警不重复发出 ─────────────────────
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["instance", "alertname"]
