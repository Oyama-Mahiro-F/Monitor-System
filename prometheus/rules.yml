# =============================================================================
# Prometheus 告警规则 — 安全监控与资源异常检测
# =============================================================================

groups:

  # ── 主机安全告警 ────────────────────────────────────────────
  - name: host_security
    rules:

      - alert: HighCPULoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[3m])) * 100) > 80
        for: 3m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "主机 CPU 使用率持续 > 80%"
          description: "{{ $labels.instance }} CPU 负载 {{ $value | humanize }}%，需排查异常进程。"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 3m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "主机内存使用率 > 85%"
          description: "{{ $labels.instance }} 内存使用率 {{ $value | humanize }}%"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes) * 100 < 10
        for: 1m
        labels:
          severity: critical
          category: storage
        annotations:
          summary: "磁盘可用空间 < 10%"
          description: "{{ $labels.instance }} 挂载点 {{ $labels.mountpoint }} 仅剩 {{ $value | humanize }}%"

      - alert: HighDiskIO
        expr: rate(node_disk_read_bytes_total[5m]) + rate(node_disk_written_bytes_total[5m]) > 104857600
        for: 5m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "磁盘 I/O > 100MB/s"
          description: "{{ $labels.instance }} 磁盘 I/O 异常偏高"

  # ── 网络安全告警 ────────────────────────────────────────────
  - name: network_security
    rules:

      - alert: HighNetworkReceive
        expr: rate(node_network_receive_bytes_total{device!="lo"}[5m]) > 104857600
        for: 3m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "入站网络流量 > 100MB/s"
          description: "{{ $labels.instance }} 网卡 {{ $labels.device }} 入站速率 {{ $value | humanize }}B/s"

      - alert: HighTCPConnections
        expr: node_netstat_Tcp_CurrEstab > 1000
        for: 3m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "TCP 当前连接数 > 1000"
          description: "{{ $labels.instance }} 存在 {{ $value }} 个 TCP 连接，需排查是否有异常连接"

  # ── 容器安全告警 (基于 cAdvisor) ──────────────────────────
  # 注意: Windows Docker Desktop 下 cAdvisor 通过 cgroup id 识别容器
  #       id 格式为 /docker/<container-id>，无 name/image label
  - name: container_security
    rules:

      # 容器 CPU 异常 — 持续占用 > 1.5 核
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{id=~"/docker/.*"}[3m]) > 0.9
        for: 2m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "容器 {{ $labels.id }} CPU 使用异常"
          description: "容器 {{ $labels.id }} 当前使用 {{ $value | humanize }} CPU 核，可能被入侵用于挖矿。"

      # 容器内存异常 — 超过 512MB
      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes{id=~"/docker/.*"} > 268435456
        for: 2m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "容器 {{ $labels.id }} 内存使用 > 512MB"
          description: "容器 {{ $labels.id }} 内存使用 {{ $value | humanize }}B，可能存在内存泄漏或攻击。"

      # 容器异常重启
      - alert: ContainerRestarted
        expr: changes(container_start_time_seconds{id=~"/docker/.*"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "容器 {{ $labels.id }} 发生重启"
          description: "容器 {{ $labels.id }} 在近 5 分钟内被重启，请排查原因。"

  # ── 服务可用性告警 ──────────────────────────────────────────
  - name: service_availability
    rules:

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "监控目标 {{ $labels.job }} ({{ $labels.instance }}) 下线"
          description: "服务 {{ $labels.job }} 已不可达超过 1 分钟，请立即排查。"
