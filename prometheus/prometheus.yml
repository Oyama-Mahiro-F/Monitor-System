# =============================================================================
# Prometheus 主配置 — 监控集群核心
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: "bupt-monitor-demo"
    env: "course-project"

# ── 告警规则 ──────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/rules.yml"

# ── 抓取目标 ──────────────────────────────────────────────────
scrape_configs:

  # ── Prometheus 自身监控 ─────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # ── 物理节点指标 (Node Exporter) ────────────────────────────
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          host: "monitor-host"

  # ── 容器指标 (cAdvisor) ─────────────────────────────────────
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"

  # ── Alertmanager ────────────────────────────────────────────
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: "alertmanager"
